name: terraform

# Static checks for a Terraform root or module: fmt, validate, tflint.
# On pull requests the result is posted (and updated) as one comment.
#   jobs:
#     terraform:
#       uses: Sakuratix/platform-ci/.github/workflows/terraform.yml@v1
#       with: { working-directory: terraform }
#       permissions: { contents: read, pull-requests: write }

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      terraform-version:
        type: string
        default: latest
      comment:
        description: Post a summary comment on pull requests
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4

      - name: fmt
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true
      - name: init
        id: init
        run: terraform init -backend=false -input=false
        continue-on-error: true
      - name: validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true
      - name: tflint
        id: tflint
        run: |
          tflint --init
          tflint --recursive -f compact
        continue-on-error: true

      - name: Report
        id: report
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          TFLINT: ${{ steps.tflint.outcome }}
          DIR: ${{ inputs.working-directory }}
        run: |
          icon() { [[ "$1" == "success" ]] && echo "✅" || echo "❌"; }
          body="<!-- platform-ci:terraform:$DIR -->
          ### Terraform \`$DIR\`
          | check | result |
          |---|---|
          | fmt | $(icon "$FMT") |
          | init | $(icon "$INIT") |
          | validate | $(icon "$VALIDATE") |
          | tflint | $(icon "$TFLINT") |"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          { echo "body<<EOF"; echo "$body"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && inputs.comment
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.report.outputs.body }}
          MARKER: "<!-- platform-ci:terraform:${{ inputs.working-directory }} -->"
        with:
          script: |
            const { BODY, MARKER } = process.env;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(MARKER));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: BODY });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body: BODY });

      - name: Fail if any check failed
        if: steps.fmt.outcome != 'success' || steps.init.outcome != 'success' || steps.validate.outcome != 'success' || steps.tflint.outcome != 'success'
        run: exit 1
