name: major tag
# Keeps the floating major tag (v1) on the newest v1.x.y release, so callers can pin
# `@v1` and get fixes without editing every repo, while `@v1.0.0` stays immutable.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [.github/workflows/major-tag.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # the only workflow here that pushes (a tag)
      - name: point vN at the newest vN.x.y
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "$latest" ] || { echo "no release tags yet"; exit 0; }
          major="${latest%%.*}"
          git tag -f "$major" "$latest^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major -> $latest ($(git rev-parse --short "$latest^{commit}"))" | tee -a "$GITHUB_STEP_SUMMARY"
