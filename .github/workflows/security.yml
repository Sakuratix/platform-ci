name: security

# Repository-wide security checks, independent of how the repo is built:
#   - gitleaks over the WHOLE git history, not just the last commit:
#     a key that was committed and "deleted" later is still leaked.
#   - Trivy on the file system: vulnerable dependencies in lockfiles and
#     risky IaC (Dockerfile, Kubernetes manifests, Helm, Terraform).
# Findings also go to the repository's Security tab as SARIF.
#
#   jobs:
#     security:
#       uses: Sakuratix/platform-ci/.github/workflows/security.yml@v1
#       permissions: { contents: read, security-events: write }

on:
  workflow_call:
    inputs:
      severity:
        description: Trivy severities that fail the build
        type: string
        default: CRITICAL,HIGH
      scanners:
        description: Trivy scanners to run
        type: string
        default: vuln,misconfig
      skip-dirs:
        description: Comma-separated directories Trivy should skip
        type: string
        default: ""
      sarif:
        description: Upload findings to the Security tab (public repos, or private with GitHub Advanced Security)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets in git history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan every commit
        run: |
          gitleaks git . --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload to the Security tab
        if: always() && inputs.sarif && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy:
    name: dependencies and IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Full report for the Security tab
        if: inputs.sarif
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip-dirs }}
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Upload to the Security tab
        if: inputs.sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

      # Same rule as docker.yml: fail only on what can actually be fixed now.
      - name: Gate on ${{ inputs.severity }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip-dirs }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"
