name: docker

# Build, lint, scan, describe and sign a container image.
#   jobs:
#     image:
#       uses: Sakuratix/platform-ci/.github/workflows/docker.yml@v1
#       with: { context: app }
#       permissions: { contents: read, packages: write, id-token: write }

on:
  workflow_call:
    inputs:
      context:
        description: Build context directory
        type: string
        default: .
      dockerfile:
        description: Dockerfile path relative to the context
        type: string
        default: Dockerfile
      image:
        description: Image name without tag. Default ghcr.io/<owner>/<repo> in lowercase
        type: string
        default: ""
      push:
        description: Push and sign the image. Never happens on pull requests
        type: boolean
        default: true
      severity:
        description: Trivy severities that fail the build
        type: string
        default: CRITICAL,HIGH
      build-args:
        description: Extra build args, one per line
        type: string
        default: ""
    outputs:
      image:
        description: Image name
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest of the pushed image (empty when not pushed)
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and push policy
        id: meta
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          WANT_PUSH: ${{ inputs.push }}
        run: |
          image="${INPUT_IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          if [[ "$WANT_PUSH" == "true" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.context }}/${{ inputs.dockerfile }}

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3
        if: steps.meta.outputs.push == 'true'

      - name: Sign image (keyless)
        if: steps.meta.outputs.push == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          PUSHED: ${{ steps.meta.outputs.push }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`$IMAGE:$GITHUB_SHA\` |"
            echo "| pushed | $PUSHED |"
            echo "| digest | \`${DIGEST:-n/a}\` |"
            echo "| signed | $([[ -n "$DIGEST" ]] && echo "cosign keyless" || echo "no") |"
            echo "| SBOM | artifact \`sbom-$GITHUB_SHA.spdx.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
